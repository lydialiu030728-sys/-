<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>长中八六高文科班 - 管理后台</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind.config = {
      theme: {
        extend: {
          colors: {
            lacquer: {
              50: '#fdf2f2',
              100: '#fde8e8',
              700: '#8c1d1d',
              800: '#731414',
              900: '#520b0b'
            },
            cream: {
              50: '#fffdf9',
              100: '#faf3e0',
              200: '#f5ebe0',
              300: '#ebd9c3',
              800: '#4a3828'
            },
            gold: {
              400: '#e6ca65',
              500: '#d4af37',
              600: '#b89222'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'serif'],
            calli: ['"Ma Shan Zheng"', 'cursive']
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Serif SC', serif;
      background-color: #2b1212;
      color: #4a3828;
    }
    .paper-texture {
      background-color: #FAF3E0;
      background-image:
        radial-gradient(#E8D7B8 0.75px, transparent 0.75px),
        radial-gradient(#E8D7B8 0.75px, #FAF3E0 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
    }
  </style>
</head>

<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center">

  <!-- Password gate -->
  <div id="loginOverlay" class="fixed inset-0 z-[9999] bg-lacquer-900 flex items-center justify-center p-4">
    <div class="paper-texture w-full max-w-sm rounded-2xl border-2 border-gold-500/60 shadow-2xl p-7 text-center">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-lacquer-700 text-gold-400 flex items-center justify-center border-2 border-gold-500 shadow-lg">
        <i class="fas fa-lock text-xl"></i>
      </div>
      <p class="text-xs tracking-[0.25em] text-lacquer-700/70 mb-2">长中八六高文科班</p>
      <h2 class="font-calli text-3xl text-lacquer-700 mb-2">管理后台登录</h2>
      <p class="text-xs text-cream-800/70 mb-5">请输入管理密码</p>

      <form id="loginForm" class="space-y-3">
        <input
          id="passwordInput"
          type="password"
          inputmode="numeric"
          autocomplete="current-password"
          placeholder="请输入密码"
          class="w-full px-4 py-3 rounded-lg bg-cream-50 border border-lacquer-700/30 focus:outline-none focus:border-lacquer-700 text-center tracking-[0.25em]"
        >
        <button
          type="submit"
          class="w-full py-3 bg-lacquer-700 hover:bg-lacquer-800 text-gold-400 font-bold rounded-lg border border-gold-500/50 shadow transition"
        >
          进入管理后台
        </button>
      </form>

      <p id="loginError" class="hidden mt-3 text-sm text-red-700 font-semibold">密码错误，请重新输入</p>
      <a href="index.html" class="inline-block mt-5 text-xs text-lacquer-700 underline">返回电子请柬</a>
    </div>
  </div>

  <header class="w-full max-w-5xl bg-lacquer-900 border-2 border-gold-500/50 rounded-2xl p-6 text-cream-100 shadow-2xl mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
    <div>
      <div class="flex items-center space-x-2">
        <span class="px-2 py-0.5 bg-gold-500 text-lacquer-900 text-xs font-bold rounded">管理后台</span>
        <span class="text-xs text-gold-400">1986 — 2026 毕业四十载</span>
      </div>
      <h1 class="font-calli text-3xl text-gold-400 mt-1">长中八六高文科班 • 报名管理</h1>
    </div>

    <a href="index.html" class="px-4 py-2 bg-cream-100 hover:bg-cream-200 text-lacquer-900 font-bold rounded-lg text-sm shadow transition flex items-center">
      <i class="fas fa-envelope-open-text mr-2"></i> 查看电子请柬
    </a>
  </header>

  <main class="w-full max-w-5xl">
    <section class="paper-texture rounded-2xl border-2 border-gold-500/40 shadow-xl p-6 sm:p-10 text-center">
      <div class="w-20 h-20 mx-auto mb-5 rounded-full bg-lacquer-700 text-gold-400 flex items-center justify-center border-2 border-gold-500 shadow-lg">
        <i class="fas fa-table-list text-2xl"></i>
      </div>

      <h2 class="font-calli text-3xl text-lacquer-700 mb-3">参会报名名单</h2>
      <p class="text-sm text-cream-800/75 leading-relaxed max-w-xl mx-auto mb-6">
        报名结果已与腾讯文档在线表格关联。点击下方按钮即可查看最新名单、筛选数据并进行统计。
      </p>

      <a
        href="https://docs.qq.com/smartsheet/DUU1zc2hXVWhXb2RH?tab=ss_ukpwya"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center justify-center px-7 py-3.5 bg-lacquer-700 hover:bg-lacquer-800 text-gold-400 font-bold rounded-xl shadow-md border border-gold-500/50 transition active:scale-95"
      >
        <i class="fas fa-arrow-up-right-from-square mr-2"></i>
        打开腾讯文档报名名单
      </a>

      <div class="mt-8 grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
        <div class="bg-cream-50 rounded-xl border border-gold-500/30 p-4">
          <i class="fas fa-user-check text-lacquer-700 mb-2"></i>
          <p class="font-semibold text-lacquer-800">实时查看</p>
          <p class="text-xs text-cream-800/60 mt-1">新提交会同步到结果表</p>
        </div>

        <div class="bg-cream-50 rounded-xl border border-gold-500/30 p-4">
          <i class="fas fa-filter text-lacquer-700 mb-2"></i>
          <p class="font-semibold text-lacquer-800">筛选统计</p>
          <p class="text-xs text-cream-800/60 mt-1">可按参会状态等条件筛选</p>
        </div>

        <div class="bg-cream-50 rounded-xl border border-gold-500/30 p-4">
          <i class="fas fa-file-export text-lacquer-700 mb-2"></i>
          <p class="font-semibold text-lacquer-800">导出整理</p>
          <p class="text-xs text-cream-800/60 mt-1">可在腾讯文档内导出和管理</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const PASSWORD = "1986";
      const STORAGE_KEY = "changshou86_admin_unlocked";

      const overlay = document.getElementById("loginOverlay");
      const form = document.getElementById("loginForm");
      const input = document.getElementById("passwordInput");
      const error = document.getElementById("loginError");

      function unlock() {
        overlay.style.display = "none";
        document.body.style.overflow = "";
      }

      if (sessionStorage.getItem(STORAGE_KEY) === "yes") {
        unlock();
      } else {
        document.body.style.overflow = "hidden";
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (input.value === PASSWORD) {
          sessionStorage.setItem(STORAGE_KEY, "yes");
          error.classList.add("hidden");
          unlock();
        } else {
          error.classList.remove("hidden");
          input.value = "";
          input.focus();
        }
      });
    })();
  </script>
</body>
</html>
