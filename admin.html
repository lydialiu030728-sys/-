    <!-- Firebase SDKs for Cloudflare Static Hosting -->

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        import { getFirestore, collection, onSnapshot, query, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";



        const appId = typeof __app_id !== 'undefined' ? __app_id : 'changshou-86-reunion';

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyCBh2SXFqi2lmvdF4UBlGbtlVNMt69ugV8",
            authDomain: "changshou-86-reunion.firebaseapp.com",
            projectId: "changshou-86-reunion",
            storageBucket: "changshou-86-reunion.firebasestorage.app",
            messagingSenderId: "925003670680",
            appId: "1:925003670680:web:5a33b0fe850b75c2cb9ced",
            measurementId: "G-9YPXKHP59H"
        };

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);

        const auth = getAuth(app);



        window.db = db;

        window.auth = auth;

        window.appId = appId;

        window.collection = collection;

        window.onSnapshot = onSnapshot;

        window.query = query;

        window.doc = doc;

        window.deleteDoc = deleteDoc;



        let syncStarted = false;

        function setSyncStatus(text, ok = true) {
            const el = document.getElementById('syncStatus');
            if (!el) return;
            el.innerHTML = `<i class="fas fa-circle ${ok ? 'text-green-400' : 'text-red-500'} text-[8px] mr-1.5"></i> ${text}`;
        }

        async function initAuth() {
            try {
                setSyncStatus("正在连接数据库…", true);

                const timeout = setTimeout(() => {
                    if (!syncStarted) {
                        setSyncStatus("连接超时", false);
                        const body = document.getElementById('rsvpTableBody');
                        if (body) {
                            body.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-800 font-serif">
                                Firebase 登录超时。请刷新页面重试。
                            </td></tr>`;
                        }
                    }
                }, 12000);

                onAuthStateChanged(auth, async (user) => {
                    if (!user || syncStarted) return;

                    syncStarted = true;
                    clearTimeout(timeout);
                    console.log("Admin anonymous auth ready:", user.uid);
                    setSyncStatus("实时同步中", true);
                    startRealtimeSync(user.uid);
                });

                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                setSyncStatus("连接失败", false);
                const code = error?.code || error?.message || "unknown";
                const body = document.getElementById('rsvpTableBody');
                if (body) {
                    body.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-800 font-serif">
                        数据库连接失败：${code}
                    </td></tr>`;
                }
            }
        }

        if (document.readyState === "loading") {
            window.addEventListener('DOMContentLoaded', initAuth, { once: true });
        } else {
            initAuth();
        }

    </script>

<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center">

    <header class="w-full max-w-5xl bg-lacquer-900 border-2 border-gold-500/50 rounded-2xl p-6 text-cream-100 shadow-2xl mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">

        <div>

            <div class="flex items-center space-x-2">

                <span class="text-xs text-gold-400">1986 — 2026 毕业四十载</span>

            <h1 class="font-calli text-3xl text-gold-400 mt-1">长中八六高文科班 • 实时签到反馈</h1>

        </div>

        <div class="flex items-center space-x-3">

    <main class="w-full max-w-5xl space-y-6">

            <div class="paper-texture p-5 rounded-xl border border-gold-500/40 shadow-md text-center">

                <span id="syncStatus" class="text-xs text-gold-300 flex items-center"><i class="fas fa-circle text-green-400 text-[8px] mr-1.5 animate-pulse"></i> 实时同步中</span>

            </div>



            <div class="overflow-x-auto">

                <table class="w-full text-left border-collapse text-sm">

                    <thead>

    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-lacquer-900 border border-gold-500 text-cream-100 px-4 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-3">

        <i id="toastIcon" class="fas fa-info-circle text-gold-400"></i>

        <span id="toastMsg" class="text-sm font-serif">提示信息</span>

    </div>



    <script>

        function startRealtimeSync(userId) {

            const appId = window.appId;

            const db = window.db;



            const rsvpCollection = window.collection(db, 'artifacts', appId, 'public', 'data', 'rsvp_entries');

            const q = window.query(rsvpCollection);



            window.onSnapshot(q, (snapshot) => {

                const entries = [];

                snapshot.forEach((docSnap) => {

                    entries.push({ id: docSnap.id, ...docSnap.data() });

                });



                entries.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                updateDashboardUI(entries);

            }, (error) => {

                console.error("Firestore snapshot error:", error);
                const code = error?.code || error?.message || "unknown";
                const status = document.getElementById('syncStatus');
                if (status) {
                    status.innerHTML = '<i class="fas fa-circle text-red-500 text-[8px] mr-1.5"></i> 同步失败';
                }
                document.getElementById('rsvpTableBody').innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-800 font-serif">
                    无法读取云端数据：${code}
                </td></tr>`;

            });

        }



        function updateDashboardUI(entries) {

            const tableBody = document.getElementById('rsvpTableBody');

            const statTotal = document.getElementById('statTotal');

            const statAttend = document.getElementById('statAttend');

            const statGuests = document.getElementById('statGuests');

            const statAbsents = document.getElementById('statAbsents');



            statTotal.innerText = entries.length;



            let attendCount = 0;

            let guestCount = 0;

            let absentCount = 0;



            if (entries.length === 0) {

                tableBody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-cream-800/60 font-serif">暂无同学提交反馈，请前往邀请函页面填写。</td></tr>`;

                statAttend.innerText = 0;

                statGuests.innerText = 0;

                statAbsents.innerText = 0;

                return;

            }



            let html = '';

            entries.forEach(item => {

                const isAttend = item.attend === '参加';

                if (isAttend) {

                    attendCount++;

                    const gNum = parseInt(item.guests) || 0;

                    guestCount += gNum;

                } else {

                    absentCount++;

                }



                const dateStr = item.createdAt ? new Date(item.createdAt).toLocaleString('zh-CN', { hour12: false }) : '刚刚';



                html += `

                    <tr class="hover:bg-cream-100/50 transition">

                        <td class="p-4 font-bold text-lacquer-900">${escapeHtml(item.name)}</td>

                        <td class="p-4"><a href="tel:${escapeHtml(item.phone)}" class="text-lacquer-700 underline font-semibold">${escapeHtml(item.phone)}</a></td>

                        <td class="p-4">

                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${isAttend ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-red-100 text-red-800 border border-red-300'}">

                                ${escapeHtml(item.attend)}

                            </span>

                        </td>

                        <td class="p-4 font-semibold text-lacquer-800">${escapeHtml(item.guests || '0')} 人</td>

                        <td class="p-4 text-xs text-cream-800/90 max-w-xs truncate" title="${escapeHtml(item.note || '')}">${escapeHtml(item.note || '无')}</td>

                        <td class="p-4 text-xs text-cream-800/70">${dateStr}</td>

                        <td class="p-4 text-center">

                            <button onclick="deleteEntry('${item.id}', '${escapeHtml(item.name)}')" class="p-1.5 text-red-600 hover:bg-red-50 rounded transition" title="删除记录">

                                <i class="fas fa-trash-alt text-xs"></i>

                            </button>

                        </td>

                    </tr>

                `;

            });



            tableBody.innerHTML = html;

            statAttend.innerText = attendCount;

            statGuests.innerText = guestCount;

            statAbsents.innerText = absentCount;

        }



        async function deleteEntry(docId, studentName) {

            if (!confirm(`确定要删除 ${studentName} 同学的反馈记录吗？`)) return;

            try {

                const appId = window.appId;

                const db = window.db;

                await window.deleteDoc(window.doc(db, 'artifacts', appId, 'public', 'data', 'rsvp_entries', docId));

                showNotification(`已成功删除 ${studentName} 的记录`, "success");

            } catch (e) {

                console.error(e);

                showNotification("删除失败，请重试", "error");

            }

        }



        function exportData() {

            showNotification("正在生成名单表格...", "success");

            const rows = document.querySelectorAll('#rsvpTableBody tr');

            let csv = '\uFEFF姓名,联系电话,参会状态,携带家属,同学寄语,提交时间\n';

            rows.forEach(tr => {

                const cols = tr.querySelectorAll('td');

                if (cols.length >= 6) {

                    const name = cols[0].innerText.trim();

                    const phone = cols[1].innerText.trim();

                    const status = cols[2].innerText.trim();

                    const guests = cols[3].innerText.trim();

                    const note = cols[4].innerText.trim().replace(/"/g, '""');

                    const time = cols[5].innerText.trim();

                    csv += `"${name}","${phone}","${status}","${guests}","${note}","${time}"\n`;

                }

            });



            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');

            a.href = url;

            a.download = `长中八六高文科班同学会反馈名单_${new Date().toISOString().slice(0, 10)}.csv`;

            document.body.appendChild(a);

            a.click();

            document.body.removeChild(a);

        }



        function showNotification(msg, type = "success") {

            const toast = document.getElementById('toast');

            const toastMsg = document.getElementById('toastMsg');

            const toastIcon = document.getElementById('toastIcon');



            toastMsg.innerText = msg;

            if (type === "success") {

                toastIcon.className = "fas fa-check-circle text-green-400";

            } else {

                toastIcon.className = "fas fa-exclamation-circle text-red-400";

            }



            toast.classList.remove('translate-y-20', 'opacity-0');

            setTimeout(() => {

                toast.classList.add('translate-y-20', 'opacity-0');

            }, 3000);

        }



        function escapeHtml(text) {

            if (!text) return '';

            return text.replace('&', '&').replace('<', '<').replace('>', '>').replace('"', '"').replace("'", ''');

        }

    </script>


    <script>
        (function () {
            const PASSWORD = "1986";
            const STORAGE_KEY = "changshou86_admin_unlocked";

            function unlockAdmin() {
                const overlay = document.getElementById("adminLoginOverlay");
                if (overlay) overlay.style.display = "none";
                document.body.style.overflow = "";
            }

            function lockAdmin() {
                document.body.style.overflow = "hidden";
            }

            document.addEventListener("DOMContentLoaded", function () {
                const form = document.getElementById("adminLoginForm");
                const input = document.getElementById("adminPassword");
                const error = document.getElementById("adminLoginError");

                if (sessionStorage.getItem(STORAGE_KEY) === "yes") {
                    unlockAdmin();
                    return;
                }

                lockAdmin();

                form.addEventListener("submit", function (e) {
                    e.preventDefault();

                    if (input.value === PASSWORD) {
                        sessionStorage.setItem(STORAGE_KEY, "yes");
                        error.classList.add("hidden");
                        unlockAdmin();
                    } else {
                        error.classList.remove("hidden");
                        input.value = "";
                        input.focus();
                    }
                });
            });
        })();
    </script>
